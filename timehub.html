<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeHub - Clock, Stopwatch & Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
        }
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        /* Remove arrows from number inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">

    <!-- Header -->
    <header class="mb-10 text-center">
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">TimeHub</h1>
        <p class="text-slate-400 text-sm md:text-base">Your complete time management dashboard</p>
    </header>

    <!-- Main Grid -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Card 1: Live Date & Clock -->
        <section class="bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col items-center justify-center lg:col-span-2">
            <h2 class="text-slate-400 text-sm font-semibold tracking-widest uppercase mb-4">Current Time</h2>
            <div id="dateDisplay" class="text-lg md:text-2xl text-cyan-300 font-medium mb-2 text-center">Loading Date...</div>
            <div id="timeDisplay" class="text-5xl md:text-7xl font-bold mono-font text-white drop-shadow-[0_0_15px_rgba(34,211,238,0.3)] text-center tracking-tight">--:--:--</div>
        </section>

        <!-- Card 2: Stopwatch -->
        <section class="bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col items-center">
            <h2 class="text-slate-400 text-sm font-semibold tracking-widest uppercase mb-6">Stopwatch</h2>
            
            <div id="stopwatchDisplay" class="text-4xl md:text-5xl font-bold mono-font text-white mb-8 tracking-wider">00:00.00</div>
            
            <div class="flex gap-4 w-full justify-center">
                <button id="swStartBtn" onclick="toggleStopwatch()" class="flex-1 max-w-[120px] bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 shadow-[0_0_15px_rgba(37,99,235,0.4)] hover:shadow-[0_0_25px_rgba(59,130,246,0.6)]">
                    Start
                </button>
                <button onclick="resetStopwatch()" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 border border-slate-600">
                    Reset
                </button>
            </div>
        </section>

        <!-- Card 3: Countdown Timer -->
        <section class="bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-3xl p-8 shadow-2xl flex flex-col items-center relative overflow-hidden">
            <!-- Timer Notification Overlay -->
            <div id="timerNotification" class="absolute inset-0 bg-red-900/90 backdrop-blur-sm flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 z-10">
                <h3 class="text-4xl font-bold text-white mb-4 animate-bounce">Time's Up!</h3>
                <button onclick="dismissTimerNotification()" class="bg-white text-red-900 font-bold py-2 px-6 rounded-xl hover:bg-red-100 transition-colors">Dismiss</button>
            </div>

            <h2 class="text-slate-400 text-sm font-semibold tracking-widest uppercase mb-6">Countdown Timer</h2>
            
            <!-- Timer Display -->
            <div id="timerDisplay" class="text-4xl md:text-5xl font-bold mono-font text-white mb-6 tracking-wider hidden">00:00:00</div>

            <!-- Timer Inputs -->
            <div id="timerInputs" class="flex items-center gap-2 sm:gap-4 mb-8">
                <div class="flex flex-col items-center">
                    <input type="number" id="timerHours" min="0" max="99" placeholder="00" class="w-16 h-16 bg-slate-900 border border-slate-600 rounded-xl text-center text-2xl font-bold text-white mono-font focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    <label class="text-xs text-slate-400 mt-2">Hours</label>
                </div>
                <span class="text-2xl font-bold text-slate-500 pb-6">:</span>
                <div class="flex flex-col items-center">
                    <input type="number" id="timerMinutes" min="0" max="59" placeholder="00" class="w-16 h-16 bg-slate-900 border border-slate-600 rounded-xl text-center text-2xl font-bold text-white mono-font focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    <label class="text-xs text-slate-400 mt-2">Minutes</label>
                </div>
                <span class="text-2xl font-bold text-slate-500 pb-6">:</span>
                <div class="flex flex-col items-center">
                    <input type="number" id="timerSeconds" min="0" max="59" placeholder="00" class="w-16 h-16 bg-slate-900 border border-slate-600 rounded-xl text-center text-2xl font-bold text-white mono-font focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                    <label class="text-xs text-slate-400 mt-2">Seconds</label>
                </div>
            </div>

            <!-- Timer Controls -->
            <div class="flex gap-4 w-full justify-center">
                <button id="tmStartBtn" onclick="toggleTimer()" class="flex-1 max-w-[120px] bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 shadow-[0_0_15px_rgba(5,150,105,0.4)] hover:shadow-[0_0_25px_rgba(16,185,129,0.6)]">
                    Start
                </button>
                <button onclick="resetTimer()" class="flex-1 max-w-[120px] bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 border border-slate-600">
                    Reset
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="mt-12 text-slate-500 text-sm">
        Designed for productivity.
    </footer>

    <script>
        // --- 1. LIVE CLOCK & DATE ---
        function updateClock() {
            const now = new Date();
            
            // Format Date (e.g., Monday, November 9, 2026)
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString(undefined, dateOptions);
            
            // Format Time (e.g., 12:07:45 PM)
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString(undefined, {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        setInterval(updateClock, 1000);
        updateClock(); // Initial call to avoid delay


        // --- 2. STOPWATCH ---
        let swStartTime = 0;
        let swElapsedTime = 0;
        let swInterval = null;
        let swRunning = false;

        const swDisplay = document.getElementById('stopwatchDisplay');
        const swStartBtn = document.getElementById('swStartBtn');

        function formatStopwatchTime(time) {
            const date = new Date(time);
            const minutes = date.getUTCMinutes().toString().padStart(2, '0');
            const seconds = date.getUTCSeconds().toString().padStart(2, '0');
            const milliseconds = Math.floor(date.getUTCMilliseconds() / 10).toString().padStart(2, '0');
            return `${minutes}:${seconds}.${milliseconds}`;
        }

        function updateStopwatchDisplay() {
            const currentTime = Date.now();
            swElapsedTime = currentTime - swStartTime;
            swDisplay.textContent = formatStopwatchTime(swElapsedTime);
        }

        function toggleStopwatch() {
            if (swRunning) {
                // Stop
                clearInterval(swInterval);
                swRunning = false;
                swStartBtn.textContent = 'Resume';
                swStartBtn.classList.replace('bg-amber-500', 'bg-blue-600');
                swStartBtn.classList.replace('hover:bg-amber-400', 'hover:bg-blue-500');
                swStartBtn.classList.replace('shadow-[0_0_15px_rgba(245,158,11,0.4)]', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
            } else {
                // Start
                swStartTime = Date.now() - swElapsedTime;
                swInterval = setInterval(updateStopwatchDisplay, 10);
                swRunning = true;
                swStartBtn.textContent = 'Pause';
                swStartBtn.classList.replace('bg-blue-600', 'bg-amber-500');
                swStartBtn.classList.replace('hover:bg-blue-500', 'hover:bg-amber-400');
                swStartBtn.classList.replace('shadow-[0_0_15px_rgba(37,99,235,0.4)]', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
            }
        }

        function resetStopwatch() {
            clearInterval(swInterval);
            swRunning = false;
            swElapsedTime = 0;
            swDisplay.textContent = '00:00.00';
            swStartBtn.textContent = 'Start';
            swStartBtn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
            swStartBtn.classList.add('bg-blue-600', 'hover:bg-blue-500', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
        }


        // --- 3. COUNTDOWN TIMER ---
        let tmTotalSeconds = 0;
        let tmInterval = null;
        let tmRunning = false;

        const tmDisplay = document.getElementById('timerDisplay');
        const tmInputs = document.getElementById('timerInputs');
        const tmStartBtn = document.getElementById('tmStartBtn');
        const tmNotification = document.getElementById('timerNotification');

        const inputHours = document.getElementById('timerHours');
        const inputMinutes = document.getElementById('timerMinutes');
        const inputSeconds = document.getElementById('timerSeconds');

        function formatTimerDisplay(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function updateTimerTick() {
            if (tmTotalSeconds <= 0) {
                // Time's up!
                clearInterval(tmInterval);
                tmRunning = false;
                tmDisplay.textContent = "00:00:00";
                
                // Show Notification visually instead of alert()
                tmNotification.classList.remove('opacity-0', 'pointer-events-none');
                tmNotification.classList.add('opacity-100', 'pointer-events-auto');
                
                resetTimerUI();
                return;
            }
            tmTotalSeconds--;
            tmDisplay.textContent = formatTimerDisplay(tmTotalSeconds);
        }

        function toggleTimer() {
            if (tmRunning) {
                // Pause
                clearInterval(tmInterval);
                tmRunning = false;
                tmStartBtn.textContent = 'Resume';
                setTimerBtnState('paused');
            } else {
                // Start / Resume
                if (tmTotalSeconds === 0) {
                    // Read from inputs if starting fresh
                    const h = parseInt(inputHours.value) || 0;
                    const m = parseInt(inputMinutes.value) || 0;
                    const s = parseInt(inputSeconds.value) || 0;
                    tmTotalSeconds = (h * 3600) + (m * 60) + s;
                }

                if (tmTotalSeconds > 0) {
                    // Hide inputs, show display
                    tmInputs.classList.add('hidden');
                    tmDisplay.classList.remove('hidden');
                    tmDisplay.textContent = formatTimerDisplay(tmTotalSeconds);
                    
                    tmInterval = setInterval(updateTimerTick, 1000);
                    tmRunning = true;
                    tmStartBtn.textContent = 'Pause';
                    setTimerBtnState('running');
                }
            }
        }

        function resetTimer() {
            clearInterval(tmInterval);
            tmRunning = false;
            tmTotalSeconds = 0;
            
            // Show inputs, hide display
            tmInputs.classList.remove('hidden');
            tmDisplay.classList.add('hidden');
            
            // Clear inputs
            inputHours.value = '';
            inputMinutes.value = '';
            inputSeconds.value = '';
            
            resetTimerUI();
            dismissTimerNotification();
        }

        function resetTimerUI() {
            tmStartBtn.textContent = 'Start';
            tmStartBtn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
            tmStartBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500', 'shadow-[0_0_15px_rgba(5,150,105,0.4)]');
        }

        function setTimerBtnState(state) {
            if (state === 'running') {
                tmStartBtn.classList.replace('bg-emerald-600', 'bg-amber-500');
                tmStartBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-amber-400');
                tmStartBtn.classList.replace('shadow-[0_0_15px_rgba(5,150,105,0.4)]', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
            } else if (state === 'paused') {
                tmStartBtn.classList.replace('bg-amber-500', 'bg-emerald-600');
                tmStartBtn.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-500');
                tmStartBtn.classList.replace('shadow-[0_0_15px_rgba(245,158,11,0.4)]', 'shadow-[0_0_15px_rgba(5,150,105,0.4)]');
            }
        }

        function dismissTimerNotification() {
            tmNotification.classList.remove('opacity-100', 'pointer-events-auto');
            tmNotification.classList.add('opacity-0', 'pointer-events-none');
        }

    </script>
</body>
</html>
